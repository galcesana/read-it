<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vox Minimal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="app-title">
      <section class="card">
        <p class="eyebrow">Text to Speech</p>
        <h1 id="app-title">Vox Minimal</h1>
        <p class="subtle">
          Paste your text, pick a voice, and press Speak.
        </p>

        <label class="field-label" for="tts-text">Text</label>
        <textarea
          id="tts-text"
          rows="8"
          placeholder="Paste or type text you want to hear..."
        ></textarea>

        <div class="controls-row">
          <div class="control-group">
            <label class="field-label" for="voice-select">Voice</label>
            <select id="voice-select" aria-label="Select voice"></select>
          </div>

          <div class="control-group speed-group">
            <label class="field-label" for="rate">Speed</label>
            <input id="rate" type="range" min="0.8" max="1.2" value="1" step="0.1" />
          </div>
        </div>

        <div class="actions">
          <button id="speak-btn" class="btn btn-primary" disabled>Speak</button>
          <button id="stop-btn" class="btn btn-ghost" type="button">Stop</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
